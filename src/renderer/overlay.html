<!DOCTYPE html>
<html><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; }

  :root {
    --accent-rgb: 168, 85, 247;
    --accent: #a855f7;
    --accent-light: #c084fc;
    --accent-lighter: #e9d5ff;
  }
  body.theme-cyber   { --accent-rgb: 34, 211, 238;  --accent: #22d3ee; --accent-light: #67e8f9; --accent-lighter: #cffafe; }
  body.theme-sunset  { --accent-rgb: 251, 146, 60;  --accent: #fb923c; --accent-light: #fdba74; --accent-lighter: #ffedd5; }
  body.theme-toxic   { --accent-rgb: 163, 230, 53;  --accent: #a3e635; --accent-light: #bef264; --accent-lighter: #ecfccb; }
  body.theme-ocean   { --accent-rgb: 45, 212, 191;  --accent: #2dd4bf; --accent-light: #5eead4; --accent-lighter: #ccfbf1; }
  body.theme-vaporwave { --accent-rgb: 236, 72, 153; --accent: #ec4899; --accent-light: #f472b6; --accent-lighter: #fce7f3; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #fff;
    -webkit-app-region: drag;
    user-select: none;
    padding: 2px;
  }

  .bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 12px;
    background: linear-gradient(160deg, rgba(20,4,32,0.94), rgba(8,0,14,0.96));
    border: 1px solid rgba(var(--accent-rgb), 0.35);
    box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.2), inset 0 0 16px rgba(var(--accent-rgb), 0.04);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  body.perf-mode .bar {
    box-shadow: inset 0 0 16px rgba(var(--accent-rgb), 0.04);
    border-color: transparent;
  }
  body.perf-mode .status-dot.running {
    box-shadow: none;
  }
  
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .metrics-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand {
    font-family: 'Michroma', sans-serif;
    font-size: 8px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .brand span { color: var(--accent-light); }

  .divider {
    width: 1px;
    height: 26px;
    background: rgba(var(--accent-rgb), 0.2);
    flex-shrink: 0;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.3px;
    text-transform: uppercase;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.running {
    background: var(--accent);
    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.7);
  }

  .metric {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
    -webkit-app-region: no-drag;
  }

  .metric-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    flex-shrink: 0;
  }

  .metric-val {
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    cursor: text;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 4.5ch;
    font-variant-numeric: tabular-nums;
  }
  .metric-val:hover { border-bottom-color: rgba(var(--accent-rgb), 0.5); }
  .metric-val .unit { font-size: 9px; color: rgba(255,255,255,0.3); margin-left: 1px; }

  .row-val-input {
    width: 3.5ch;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 19px;
    font-weight: 700;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(var(--accent-rgb), 0.8);
    color: #fff;
    padding: 0;
    -webkit-app-region: no-drag;
  }
  .row-val-input:focus { outline: none; }
  .row-val-input::-webkit-outer-spin-button,
  .row-val-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row-val-input[type="number"] { -moz-appearance: textfield; }

  input[type=range] {
    flex: 1;
    min-width: 60px;
    height: 4px;
    border-radius: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.08);
    accent-color: var(--accent);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent-light);
    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.9);
    cursor: pointer;
  }

  .metrics-row input[type=range] {
    display: none;
  }

  .btns { display: flex; gap: 5px; flex-shrink: 0; -webkit-app-region: no-drag; }
  .ibtn {
    width: 22px; height: 22px; border-radius: 6px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4);
    font-size: 11px; transition: all 0.15s;
  }
  .ibtn-pin {
    width: 26px; height: 26px;
  }
  .ibtn:hover { background: rgba(var(--accent-rgb), 0.2); color: var(--accent-lighter); }
  .ibtn.active { background: rgba(var(--accent-rgb), 0.35); color: var(--accent-lighter); box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.5); }
</style></head>
<body>
  <div class="bar">
    <div class="top-row">
      <div class="brand">SURFACE<span>·</span>CLICKER</div>
      <div class="status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">idle</span>
      </div>
      <div class="btns">

      <button class="ibtn ibtn-pin" id="pin" title="Stay on top">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14 4v5.5l1.8 2.4c.3.4.1 1-.4 1.1H13v6l-1 2-1-2v-6H7.6c-.5-.1-.7-.7-.4-1.1L9 9.5V4h5zm1-2H9c-.6 0-1 .4-1 1s.4 1 1 1h6c.6 0 1-.4 1-1s-.4-1-1-1z"/>
        </svg>
      </button>
        <button class="ibtn" id="close" title="Close">✕</button>
      </div>
    </div>

    <div class="metrics-row">
      <div class="metric">
        <span class="metric-label">CPS</span>
        <span class="metric-val" id="cpsVal">12<span class="unit">/s</span></span>
        <input type="range" id="cps" min="1" max="100" step="0.5" />
      </div>

      <div class="divider"></div>

      <div class="metric">
        <span class="metric-label">CDC</span>
        <span class="metric-val" id="dcVal">65<span class="unit">%</span></span>
        <input type="range" id="dc" min="1" max="100" step="1" />
      </div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body></html>
