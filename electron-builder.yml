appId: com.surfaceclicker.app
productName: Surface Clicker
directories:
  buildResources: assets
  output: build
files:
  - src/**/*
  - assets/**/*
  - package.json
win:
  icon: assets/SurfaceClicker.ico
  target:
    - target: nsis
      arch: x64
  artifactName: "${productName} Setup v${version}.exe"
mac:
  icon: assets/SurfaceClicker.icns
  target: dmg
linux:
  icon: assets/SurfaceClicker.png
  target: AppImage
